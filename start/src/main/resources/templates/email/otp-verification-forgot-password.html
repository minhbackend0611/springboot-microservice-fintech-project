<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${appName} + ' - Forgot Password OTP Verification'">Forgot Password OTP Verification</title>
</head>

<body style="margin:0; padding:0; background-color:#f5f7fb; font-family:Arial, Helvetica, sans-serif;">

<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:40px 0;">
    <tr>
        <td align="center">

            <table role="presentation"
                   width="480"
                   style="background:#ffffff; border-radius:12px; padding:32px; box-shadow:0 4px 16px rgba(0,0,0,0.08);">

                <!-- Header -->
                <tr>
                    <td style="text-align:center; padding-bottom:20px;">
                        <h2 style="margin:0; color:#111827;">
                            <span th:text="'[' + ${appName} + ']'">[App]</span>
                        </h2>
                    </td>
                </tr>

                <!-- Title (Forgot password context) -->
                <tr>
                    <td style="text-align:center;">
                        <h3 style="margin:0; color:#111827;">Forgot Password? Verify Your Identity</h3>
                        <p style="color:#6b7280; margin-top:8px;">
                            Please use the OTP below to reset your password.
                        </p>
                    </td>
                </tr>

                <!-- OTP -->
                <tr>
                    <td align="center" style="padding:24px 0;">
                        <div th:text="${otp}"
                             style="font-size:28px; letter-spacing:8px; font-weight:bold;
                                    color:#2563eb; background:#eef2ff;
                                    padding:16px 24px; border-radius:8px;
                                    display:inline-block;">
                            000000
                        </div>
                    </td>
                </tr>

                <!-- Duration + security note -->
                <tr>
                    <td style="text-align:center;">
                        <p style="color:#374151; margin:0;">
                            This verification code will expire in
                            <b th:text="${duration}">5 minutes</b>.
                        </p>

                        <p style="color:#6b7280; font-size:13px; margin-top:12px;">
                            If you did not request a password reset, please ignore this message or contact support immediately.
                        </p>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="text-align:center; padding-top:24px; font-size:12px; color:#9ca3af;">
                        © 2026 <span th:text="${appName}">App</span>. All rights reserved.
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
